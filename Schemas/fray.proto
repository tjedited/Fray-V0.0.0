syntax = "proto3";

package fray;

// Frame layout: [routing prefix (fixed binary)] [Header (this file)] [payload bytes].
// The prefix and payload are not protobuf. Only the Header below is.

// Kind of process or component a message is sent from or addressed to.
// Used numerically in the routing prefix. Never reuse a number.
enum ProcessKind {
  PROCESS_KIND_UNSPECIFIED = 0;
  PROCESS_KIND_ENGINE = 1;
  PROCESS_KIND_ENGINE_PLUGIN = 2;
  PROCESS_KIND_ELECTRON_MAIN = 3;
  PROCESS_KIND_ELECTRON_RENDERER = 4;
  PROCESS_KIND_ELECTRON_PLUGIN = 5;
  // Destination only: every process except the sender. Never a sender.
  PROCESS_KIND_BROADCAST = 6;
}

// How the payload bytes are encoded. CUSTOM means Fray's utilities cannot decode it.
enum PayloadType {
  PAYLOAD_TYPE_NONE = 0;
  PAYLOAD_TYPE_PROTOBUF = 1;
  PAYLOAD_TYPE_JSON = 2;
  PAYLOAD_TYPE_CUSTOM = 3;
}

// Which schema to decode the payload with. Never reuse a number.
enum MessageType {
  MESSAGE_TYPE_NONE = 0;
  MESSAGE_TYPE_HEALTH_REPORT = 1;
  MESSAGE_TYPE_PROJECT_OPEN_REQUEST = 2;
  MESSAGE_TYPE_PROJECT_OPEN_RESULT = 3;
  MESSAGE_TYPE_PROMPT_REQUEST = 4;
  MESSAGE_TYPE_PROMPT_RESPONSE = 5;
  MESSAGE_TYPE_PROJECT_CREATE_REQUEST = 6;
  MESSAGE_TYPE_PROJECT_CREATE_RESULT = 7;
  MESSAGE_TYPE_PROJECT_CLOSE_REQUEST = 8;
  MESSAGE_TYPE_PROJECT_CLOSE_RESULT = 9;
}

// Initial core commands used by the Engine and Electron main process.
enum Command {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_TEST = 1;
  COMMAND_QUIT = 2;
  // "I can receive messages now." Sent to everyone when a process starts, or to one process as a reply.
  COMMAND_READY = 3;
  // "Tell me if you are ready." Answered with COMMAND_READY, sent only to the sender.
  COMMAND_REQUEST_READY = 4;
  COMMAND_PING = 5;
  COMMAND_PONG = 6;
  COMMAND_OPEN_PROJECT = 7;
  COMMAND_PROJECT_OPEN_RESULT = 8;
  COMMAND_PROMPT_REQUEST = 9;
  COMMAND_PROMPT_RESPONSE = 10;
  COMMAND_CREATE_PROJECT = 11;
  COMMAND_PROJECT_CREATE_RESULT = 12;
  COMMAND_CLOSE_PROJECT = 13;
  COMMAND_PROJECT_CLOSE_RESULT = 14;
}

message ProjectCloseRequest {
  bool package = 1;
}

message ProjectCloseResult {
  uint64 request_id = 1;
  string name = 2;
  bool success = 3;
  bool packaged = 4;
  string error = 5;
}

enum ProjectCreateChoice {
  PROJECT_CREATE_NEW = 0;
  PROJECT_OPEN_EXISTING = 1;
  PROJECT_OPEN_ARCHIVE = 2;
  PROJECT_OPEN_FOLDER = 3;
  PROJECT_SELECT_ARCHIVE = 4;
  PROJECT_SELECT_FOLDER = 5;
  PROJECT_CREATE_IN_FOLDER = 6;
  PROJECT_CREATE_IN_FOLDER_RESOLVE = 7;
}

enum ProjectCreateStatus {
  PROJECT_CREATE_FAILED = 0;
  PROJECT_CREATE_SUCCEEDED = 1;
  PROJECT_OPEN_SUCCEEDED = 2;
  PROJECT_FOLDER_CONFLICT = 3;
  PROJECT_ARCHIVE_CONFLICT = 4;
  PROJECT_BOTH_CONFLICT = 5;
  PROJECT_INVALID_DATABASE = 6;
}

message ProjectCreateRequest {
  string path = 1;
  ProjectCreateChoice choice = 2;
}

message ProjectCreateResult {
  uint64 request_id = 1;
  string path = 2;
  ProjectCreateStatus status = 3;
  string error = 4;
}

message PromptButton {
  string label = 1;
  string value = 2;
}

message PromptRequest {
  string title = 1;
  string description = 2;
  repeated PromptButton buttons = 3;
  optional bool dismissible = 4;
}

message PromptResponse {
  uint64 request_id = 1;
  bool dismissed = 2;
  string value = 3;
  string error = 4;
}

message ProjectOpenRequest {
  string name = 1;
}

message ProjectOpenResult {
  string name = 1;
  bool success = 2;
  string error = 3;
  uint64 request_id = 4;
}

message Header {
  uint32 protocol_version = 1;
  uint64 message_id = 2;        // Unique per sender
  uint64 timestamp = 3;         // Sender clock, milliseconds since the Unix epoch
  uint32 flags = 4;             // Reserved bits
  string sender_name = 5;       // For logs and name-to-ID mapping
  string destination_name = 6;  // For logs and name-to-ID mapping
  optional string target_project = 7;
  PayloadType payload_type = 8;
  MessageType message_type = 9;
  // How long, in milliseconds, a router may hold this message in its outgoing queue waiting for the
  // destination to be ready. The countdown starts when each router queues it. 0 = never expires.
  uint32 ttl_ms = 10;
}

message QueueHealth {
  ProcessKind destination = 1;
  uint64 depth = 2;
  uint64 oldest_age_ms = 3;
}

message HealthReport {
  uint64 processed_count = 1;
  uint64 progress_age_ms = 2;
  uint64 heartbeat = 3;
  repeated QueueHealth queues = 4;
}
